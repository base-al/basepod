name: ci
on:
  push: {branches: [main, "feat/**", "fix/**", "docs/**"]}
  pull_request:
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build && npm run type-check && npm test
      # High/critical advisories fail the build; --audit-level=high already
      # makes npm audit exit 0 when only low/moderate findings exist (e.g.
      # the esbuild dev-server advisory), so no `|| true` is needed here —
      # adding one would silence the high/critical findings this step
      # exists to catch.
      - run: cd web && npm audit --audit-level=high
      - uses: actions/setup-go@v5
        with: {go-version: 'stable'}
      - run: go vet ./...
      - run: CGO_ENABLED=0 go build ./...
      - run: go test ./... -count=1
      # Fails the build on any reachable known vulnerability in the Go
      # standard library or a dependency (see SECURITY.md's "known
      # limitations" for the last time this was manually swept).
      - run: go run golang.org/x/vuln/cmd/govulncheck@latest ./...
  e2e:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: cd web && npm ci && npm run build
      - uses: actions/setup-go@v5
        with: {go-version: 'stable'}
      - run: podman version   # preinstalled on ubuntu-24.04 runners
      - run: systemctl --user enable --now podman.socket
      - run: ./scripts/e2e-local.sh
